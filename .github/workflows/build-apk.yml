name: Build OmniNote Pro APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME); just accept licenses and make sure API 35 is present.
      - name: Prepare Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -n1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # AGP 8.7.3 needs Gradle 8.9+; 8.10.2 is used for both the wrapper and the setup action.
      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Ensure Gradle wrapper
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            gradle wrapper --gradle-version 8.10.2
          fi
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -f gradlew ]; then
            # Regenerates gradlew, gradlew.bat and the wrapper jar; keeps the committed properties file's version.
            gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x gradlew
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniNote-Pro-RedmiPadPro5G-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
